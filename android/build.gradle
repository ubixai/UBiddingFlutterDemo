// Paths are relative to the Android root. Plugin checkouts keep the core
// AAR in the package android/libs. Developers of the exported app do not
// have that tree; they place the AAR in android/sdk.
def sdkCandidates = [
    '../../android/libs',
    'sdk',
]
def selectedSdkDir = sdkCandidates.find { candidate ->
    rootProject.file(candidate).isDirectory()
}
if (!hasProperty('UBIDDING_ANDROID_SDK_DIR') &&
        System.getenv('UBIDDING_ANDROID_SDK_DIR') == null) {
    if (selectedSdkDir == null) {
        throw new GradleException(
            '将 UBidding.SDK_4.1.2.11.aar 放到 android/sdk/ ' +
            '（相对本工程的 android 目录）。')
    }
    ext.UBIDDING_ANDROID_SDK_DIR = selectedSdkDir
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
