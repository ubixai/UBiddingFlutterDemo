# 限制并发以降低 Jetifier/Dex 峰值内存。
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=true

# 未设置 UBIDDING_ANDROID_SDK_DIR 时，插件仓库使用 android/libs。
# 独立示例请把 UBidding.SDK_4.1.2.11.aar 放到 android/sdk。
# 三方广告 AAR 放在 android/libs。
